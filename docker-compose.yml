services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - ./frontend/.env.local
    environment:
      OPENAPI_URL: http://backend:8000/openapi.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend:/app
      - packages:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    command: >
      sh -ec '
        lock_hash=$$(sha256sum package-lock.json | cut -d " " -f 1);
        if [ ! -f node_modules/.webmun-lock-hash ] ||
           [ "$$(cat node_modules/.webmun-lock-hash)" != "$$lock_hash" ]; then
          npm ci;
          printf "%s" "$$lock_hash" > node_modules/.webmun-lock-hash;
        fi;
        npm run generate:schema;
        exec npm run dev -- --host 0.0.0.0 --port 5173
      '
    develop:
      watch:
        - action: restart
          path: ./backend/app/session/schemas.py
        - action: restart
          path: ./backend/app/session/models.py
        - action: restart
          path: ./backend/app/session/enums.py

  redis:
    image: redis:latest
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 1s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    environment:
      - SUPABASE_URL=http://host.docker.internal:54321
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@host.docker.internal:54322/postgres
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
      - backend_packages:/app/.venv
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request, sys;
                      res = urllib.request.urlopen('http://localhost:8000/committees/health', timeout=3);
                      sys.exit(0) if res.getcode() == 200 else sys.exit(1); "]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 50s
      start_interval: 1s

volumes:
  packages:
  backend_packages:
  redis_data:
